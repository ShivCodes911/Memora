<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Deep Ambient Glow Shadow -->
    <filter id="ambientShadow" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.25"/>
    </filter>

    <!-- Translucent Frosted Glass Background -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#18181B" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Subtle Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Capsule Container -->
  <g filter="url(#ambientShadow)" transform="translate(100, 70)">
    <!-- Main Capsule Pill -->
    <rect width="700" height="74" rx="37" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <!-- Left: Badge (3 Selected) -->
    <g transform="translate(36, 21)">
      <rect width="115" height="32" rx="16" fill="#7C3AED" fill-opacity="0.2" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.4"/>
      <circle cx="20" cy="16" r="3.5" fill="#A855F7"/>
      <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', monospace" font-weight="700" font-size="13" fill="#E9D5FF">
        3 selected
      </text>
    </g>

    <!-- Center: Select Page Button -->
    <g transform="translate(175, 21)">
      <rect width="125" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06"/>
      <path d="M197 37 l5 5 l10 -10" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="220" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#E4E4E7">
        Select Page
      </text>
    </g>

    <!-- Apple Hairline Divider -->
    <line x1="324" y1="25" x2="324" y2="49" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>

    <!-- Delete Action Button -->
    <g transform="translate(346, 21)">
      <rect width="105" height="32" rx="16" fill="#EF4444" fill-opacity="0.12" stroke="#EF4444" stroke-width="1" stroke-opacity="0.25"/>
      <path d="M366 32 l1 11 a2 2 0 0 0 2 2 h8 a2 2 0 0 0 2 -2 l1 -11 m-14 0 h16 m-11 0 v-2 a1 1 0 0 1 1 -1 h4 a1 1 0 0 1 1 1 v2" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="395" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#FCA5A5">
        Delete (3)
      </text>
    </g>

    <!-- Done High-Contrast Pill -->
    <g transform="translate(580, 19)">
      <rect width="84" height="36" rx="18" fill="#FFFFFF"/>
      <text x="622" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13.5" fill="#09090B">
        Done
      </text>
    </g>
  </g>
</svg>