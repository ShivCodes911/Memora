<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7164C0" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>

    <!-- Brain Violet Linear Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Specular Inner Glow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#7C3AED" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="800" height="800" fill="url(#bgGlow)" rx="48"/>

  <!-- Subtle Radial Grid Pattern -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="0.5">
    <circle cx="400" cy="400" r="120" fill="none" stroke-dasharray="4 4"/>
    <circle cx="400" cy="400" r="220" fill="none"/>
    <circle cx="400" cy="400" r="320" fill="none" stroke-dasharray="6 6"/>
  </g>

  <!-- Centered Logo Squircle Container -->
  <g filter="url(#softShadow)" transform="translate(260, 260)">
    <rect width="280" height="280" rx="64" fill="#18181B" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.5"/>
    <rect width="280" height="280" rx="64" fill="url(#violetGrad)" opacity="0.15"/>
    
    <!-- Outer Specular Ring -->
    <rect x="1" y="1" width="278" height="139" rx="63" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- Scaled Brain SVG Emblem -->
    <g transform="translate(56, 56) scale(12)" filter="url(#purpleGlow)">
      <!-- Left Hemisphere -->
      <path stroke="url(#violetGrad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"
        d="M4.61959 1.43823c1.31451 0 2.38014 1.06563 2.38014 2.38014l-0.00006 6.47043c0 1.5044 -1.2196 2.724 -2.72405 2.724 -1.50446 0 -2.72406 -1.2196 -2.72406 -2.724 0 -0.0771 0.00321 -0.1534 0.00949 -0.2289C0.994116 9.45085 0.636414 8.25951 0.636414 7.26549c0 -1.35449 0.664156 -2.67144 1.616866 -3.18911 -0.00914 -0.08475 -0.01383 -0.17083 -0.01383 -0.25801 0 -1.31451 1.06563 -2.38014 2.38014 -2.38014Z"/>
      <path stroke="#E9D5FF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none"
        d="M3.51106 5.69409c-0.34948 -0.07968 -1.14142 -0.59904 -1.26091 -1.61157"/>
      <path stroke="#E9D5FF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none"
        d="M4.97003 8.36479c1.42751 -0.15933 1.9932 -1.66583 2.02998 -2.27861"/>
      <path stroke="#E9D5FF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none"
        d="M2.28949 8.63184c-0.35556 0.28074 -0.63905 0.91698 -0.7309 1.42666"/>

      <!-- Right Hemisphere -->
      <path stroke="url(#violetGrad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"
        d="M9.38017 1.43823c-1.31452 0 -2.38014 1.06563 -2.38014 2.38014l0.00006 6.47043c0 1.5044 1.2196 2.724 2.72405 2.724 1.50446 0 2.72406 -1.2196 2.72406 -2.724 0 -0.0771 -0.0032 -0.1534 -0.0095 -0.2289 0.5669 -0.60905 0.9246 -1.80039 0.9246 -2.79441 0 -1.35449 -0.6641 -2.67144 -1.6168 -3.18911 0.0091 -0.08475 0.0138 -0.17083 0.0138 -0.25801 0 -1.31451 -1.0656 -2.38014 -2.38013 -2.38014Z"/>
      <path stroke="#E9D5FF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none"
        d="M10.4887 5.69409c0.3495 -0.07968 1.1414 -0.59904 1.2609 -1.61157"/>
      <path stroke="#E9D5FF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none"
        d="M9.02972 8.36479c-1.4275 -0.15933 -1.9932 -1.66583 -2.02998 -2.27861"/>
      <path stroke="#E9D5FF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none"
        d="M11.7103 8.63184c0.3555 0.28074 0.639 0.91698 0.7309 1.42666"/>
    </g>
  </g>

  <!-- Typography Brandmark -->
  <text x="400" y="610" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="-1.5">
    Memora
  </text>
  <text x="400" y="645" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#A855F7" letter-spacing="4">
    YOUR SECOND BRAIN
  </text>
</svg>