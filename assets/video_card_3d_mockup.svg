<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#7C3AED" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E22"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>

    <linearGradient id="thumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
  </defs>

  <!-- 3D Perspective Card Container -->
  <g filter="url(#cardShadow)" transform="translate(100, 60)">
    <!-- Base Card Shell -->
    <rect width="500" height="660" rx="28" fill="url(#cardBg)" stroke="#8B5CF6" stroke-width="1.8" stroke-opacity="0.5"/>
    
    <!-- Top Card Header -->
    <g transform="translate(24, 20)">
      <!-- Video Icon Badge -->
      <circle cx="16" cy="16" r="16" fill="#8B5CF6" fill-opacity="0.18"/>
      <path d="M12 11 l10 5 l-10 5 Z" fill="#C084FC"/>
      
      <!-- Domain Label -->
      <text x="44" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#9CA3AF">
        youtube.com
      </text>

      <!-- Three Dots -->
      <circle cx="430" cy="16" r="2.5" fill="#6B7280"/>
      <circle cx="438" cy="16" r="2.5" fill="#6B7280"/>
      <circle cx="446" cy="16" r="2.5" fill="#6B7280"/>

      <line x1="0" y1="38" x2="452" y2="38" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    </g>

    <!-- 16:9 Thumbnail Mockup -->
    <g transform="translate(24, 76)">
      <rect width="452" height="254" rx="18" fill="url(#thumbGrad)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>
      
      <!-- Video Play Icon Overlay -->
      <circle cx="226" cy="127" r="32" fill="#FF0000" fill-opacity="0.95"/>
      <path d="M220 115 l18 12 l-18 12 Z" fill="#FFFFFF"/>
      
      <!-- Duration Badge -->
      <rect x="382" y="218" width="56" height="24" rx="6" fill="#000000" fill-opacity="0.85"/>
      <text x="410" y="234" text-anchor="middle" font-family="monospace" font-weight="700" font-size="11" fill="#FFFFFF">
        24:18
      </text>
    </g>

    <!-- Title & Metadata -->
    <g transform="translate(24, 350)">
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="19" fill="#FFFFFF" letter-spacing="-0.5">
        Complete System Design Blueprint
      </text>
      <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="14" fill="#9CA3AF">
        Distributed caching, event loops &amp; indexing strategies
      </text>
    </g>

    <!-- Primary Action Buttons -->
    <g transform="translate(24, 430)">
      <!-- YouTube Watch Video Button -->
      <rect width="320" height="48" rx="14" fill="url(#ytGrad)"/>
      <path d="M125 24 l12 7 l-12 7 Z" fill="#FFFFFF"/>
      <text x="146" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">
        Watch Video
      </text>

      <!-- Open Link Ghost Button -->
      <rect x="336" width="116" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
      <text x="394" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#E4E4E7">
        Open ↗
      </text>
    </g>

    <!-- Lower Notes Area -->
    <g transform="translate(24, 505)">
      <rect width="452" height="120" rx="16" fill="#000000" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.06"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#A855F7" letter-spacing="1">
        NOTE
      </text>
      <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#D1D5DB">
        Key architectural takeaways for Review 1 Major Project.
      </text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#9CA3AF">
        Includes compound index trade-offs &amp; SSRF notes.
      </text>
    </g>
  </g>
</svg>